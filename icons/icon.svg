<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="feltBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#157338" />
      <stop offset="70%" stop-color="#0a461e" />
      <stop offset="100%" stop-color="#04230d" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="120" fill="url(#feltBg)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Playing Card Motif -->
  <g filter="url(#shadow)" transform="translate(140, 110) rotate(-8, 116, 160)">
    <rect width="210" height="300" rx="20" fill="#7a111a" stroke="#ffffff" stroke-width="6"/>
    <ellipse cx="105" cy="165" rx="36" ry="48" fill="#ffffff"/>
    <circle cx="105" cy="110" r="24" fill="#ffffff"/>
    <!-- Spider legs -->
    <path d="M90,130 Q45,100 30,80 M85,145 Q40,140 25,145 M85,165 Q40,190 30,210 M90,185 Q45,230 40,255" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M120,130 Q165,100 180,80 M125,145 Q170,140 185,145 M125,165 Q170,190 180,210 M120,185 Q165,230 170,255" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Overlapping Foreground Card -->
  <g filter="url(#shadow)" transform="translate(170, 130) rotate(10, 116, 160)">
    <rect width="210" height="300" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.15)" stroke-width="4"/>
    <!-- Rank Q and Spades -->
    <text x="25" y="55" font-family="-apple-system, sans-serif" font-size="44" font-weight="bold" fill="#1e1e1e">Q</text>
    <path d="M38,70 C35,80 18,90 18,102 C18,110 24,114 31,114 C36,114 37,111 38,108 C39,111 41,114 46,114 C53,114 59,110 59,102 C59,90 41,80 38,70 Z M35,108 L33,118 L43,118 L41,108 Z" fill="#1e1e1e"/>
    <!-- Center Spade -->
    <path d="M105,120 C95,150 45,180 45,215 C45,235 62,246 80,246 C92,246 98,238 105,230 C112,238 118,246 130,246 C148,246 165,235 165,215 C165,180 115,150 105,120 Z M98,230 L92,260 L118,260 L112,230 Z" fill="#1e1e1e"/>
  </g>

  <!-- Sneaker / Step Counter Badge in Corner -->
  <g transform="translate(330, 330)" filter="url(#shadow)">
    <circle cx="65" cy="65" r="65" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
    <text x="65" y="82" font-size="62" text-anchor="middle">👟</text>
  </g>
</svg>
