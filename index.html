<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jueguitos - Mobile Arcade</title>
  <meta name="description" content="Custom ad-free mobile arcade for Ellen & Susan with integrated walking step counter.">
  <meta name="theme-color" content="#03200c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jueguitos">
  
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/step-counter.css">
  <link rel="stylesheet" href="styles/wow.css">
  <link rel="stylesheet" href="styles/toyblast.css">
  <link rel="stylesheet" href="styles/matchington.css">
  <link rel="stylesheet" href="styles/refinements.css">
</head>
<body>
  <div id="app">
    <!-- 1. The Step Counter Banner (Directly in place of the Ad slot!) -->
    <header id="stepBannerContainer"></header>

    <!-- 2. The Arcade Game Switcher Tabs -->
    <div id="arcadeNavContainer"></div>

    <!-- 3. The Main Game Area (Spider Solitaire or WoW) -->
    <main id="gameContainer"></main>

    <!-- 4. Login Modal with 3D Avatars (Approved Players) -->
    <div class="login-overlay" id="loginModal" style="display: none;">
      <div class="login-card">
        <div class="login-logo" id="loginLogo">
          <svg class="svg-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="6" fill="rgba(16, 185, 129, 0.2)"></rect>
            <path d="M6 12h4M8 10v4" stroke-width="2.2"></path>
            <circle cx="15.5" cy="10.5" r="1.2" fill="#34d399"></circle>
            <circle cx="17.5" cy="13.5" r="1.2" fill="#34d399"></circle>
          </svg>
        </div>
        <h1 class="login-title">Jueguitos</h1>
        <p class="login-subtitle">A little time for yourself.</p>
        <p class="login-instruction">Tap your picture to play.</p>

        <!-- Quick 1-Tap Player Selector for all 6 approved players -->
        <div class="login-quick-select" id="loginQuickSelect">
          <button type="button" class="player-select-btn selected" data-user="ellen">
            <img class="player-avatar-thumb" src="assets/avatars/ellen.png" alt="Ellen">
            <span>Ellen</span>
          </button>
          <button type="button" class="player-select-btn" data-user="susan">
            <img class="player-avatar-thumb" src="assets/avatars/susan.png" alt="Susan">
            <span>Susan</span>
          </button>
          <button type="button" class="player-select-btn" data-user="daniel">
            <img class="player-avatar-thumb" src="assets/avatars/daniel.png" alt="Daniel">
            <span>Daniel</span>
          </button>
          <button type="button" class="player-select-btn" data-user="rebekkah">
            <img class="player-avatar-thumb" src="assets/avatars/rebekkah.png" alt="Rebekkah">
            <span>Rebekkah</span>
          </button>
          <button type="button" class="player-select-btn" data-user="steph">
            <img class="player-avatar-thumb" src="assets/avatars/steph.png" alt="Steph">
            <span>Steph</span>
          </button>
          <button type="button" class="player-select-btn" data-user="trey">
            <img class="player-avatar-thumb" src="assets/avatars/trey.png" alt="Trey">
            <span>Trey</span>
          </button>
        </div>

        <details class="manual-login"><summary>Sign in with a password</summary>
        <form class="login-form" onsubmit="return false;">
          <div class="login-field">
            <label for="loginUsername">Player Name</label>
            <input type="text" id="loginUsername" value="Ellen" autocomplete="username" autocapitalize="words" required>
          </div>

          <div class="login-field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password..." autocomplete="current-password" required>
          </div>

          <div class="login-error" id="loginError"></div>

          <button type="submit" class="login-submit-btn" id="loginSubmitBtn">Start Playing</button>
        </form>
        </details>
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
